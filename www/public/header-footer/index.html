<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Header institucional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js" defer></script>
  </head>
  <body class="bg-gray-100">
    <!-- HEADER -->
    <header class="w-full bg-[#e6b823]">
      <!-- logo -->
      <div class="max-w-6xl mx-auto px-4">
        <div class="grid grid-cols-3 items-center py-3">
          <div></div>
          <div class="flex justify-center">
            <a href="/" class="inline-flex items-center gap-2">
              <img
                src="./Logo-CNMH-02.png"
                alt="Centro Nacional de Memoria Histórica"
                class="h-16 md:h-24"
              />
            </a>
          </div>
          <!-- botón móvil -->
          <div class="flex justify-end md:hidden">
            <button
              data-collapse-toggle="main-nav"
              type="button"
              class="inline-flex items-center p-2 text-gray-900 hover:bg-[#f5cd50] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#009ad9]"
              aria-controls="main-nav"
              aria-expanded="false"
            >
              <span class="sr-only">Abrir menú</span>
              <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 17 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M1 1h15M1 7h15M1 13h15" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- barra de navegación -->
      <div class="bg-[#f5cd50]">
        <div class="max-w-6xl mx-auto px-4">
        <!-- DESKTOP -->
            <!-- NAV desktop (solo la parte de los links) -->
            <nav class="hidden md:flex gap-6 text-sm md:text-base font-medium text-[#3c3c3c] justify-center">
            <!-- INICIO -->
            <a href="https://centrodememoriahistorica.gov.co/" data-navitem class="py-3 border-b-4 border-transparent hover:border-[#1ca4d7]">Inicio</a>
            <a href="https://centrodememoriahistorica.gov.co/calendario" data-navitem class="py-3 border-b-4 border-transparent hover:border-[#1ca4d7]">Agenda</a>
            <a href="https://centrodememoriahistorica.gov.co/noticias" data-navitem class="py-3 border-b-4 border-transparent hover:border-[#1ca4d7]">Noticias</a>
            <a href="https://centrodememoriahistorica.gov.co/atencion-al-ciudadano/" data-navitem class="py-3 border-b-4 border-transparent hover:border-[#1ca4d7]">
                Atención y Servicio a la Ciudadanía
            </a>
            <a href="https://centrodememoriahistorica.gov.co/transparencia-y-acceso-a-la-informacion-publica/" data-navitem class="py-3 border-b-4 border-transparent hover:border-[#1ca4d7]">
                Transparencia
            </a>
            <a href="https://centrodememoriahistorica.gov.co/participa/" data-navitem class="py-3 border-b-4 border-transparent hover:border-[#1ca4d7]">Participa</a>
            </nav>

            <!-- MOBILE -->
            <div id="main-nav" class="hidden md:hidden">
                <ul class="flex flex-col gap-1 py-3 text-[#3c3c3c] font-medium">
                <!-- Inicio móvil -->
                <li><a href="https://centrodememoriahistorica.gov.co" class="block py-2">Inicio</a></li>
                <li><a href="https://centrodememoriahistorica.gov.co/calendario" class="block py-2">Agenda</a></li>
                <li><a href="https://centrodememoriahistorica.gov.co/noticias" class="block py-2">Noticias</a></li>
                <li><a href="https://centrodememoriahistorica.gov.co/atencion-al-ciudadano/" class="block py-2">Atención y Servicio a la Ciudadanía</a></li>
                <li><a href="https://centrodememoriahistorica.gov.co/transparencia-y-acceso-a-la-informacion-publica/" class="block py-2">Transparencia</a></li>
                <li><a href="https://centrodememoriahistorica.gov.co/participa/" class="block py-2">Participa</a></li>
                </ul>
            </div>
        </div>
      </div>
    </header>
  </body>
    <script>
    const navItems = document.querySelectorAll("[data-navitem]");

    navItems.forEach((item) => {
        item.addEventListener("click", (e) => {
        e.preventDefault();

        navItems.forEach((el) => {
            el.classList.remove("border-[#1ca4d7]");
            el.classList.add("border-transparent", "border-b-4");
        }); 
        item.classList.remove("border-transparent");
        item.classList.add("border-[#1ca4d7]", "border-b-4");
        });
    });
    </script>

</html>
