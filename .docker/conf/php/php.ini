date.timezone = America/Bogota

; Errores al log, nunca en la respuesta (Laravel los muestra según APP_DEBUG)
display_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off

post_max_size = 2048M
upload_max_filesize = 2048M
memory_limit = 2048M
max_execution_time = 1800

; Mitigación PHP2Shell (CVE-2026-109618/109619): la app no usa el progreso de carga nativo
session.upload_progress.enabled = 0
